<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolBox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🔧</span>
        <span class="brand-name">ToolBox</span>
      </div>

      <nav class="nav">
        <div class="nav-group">
          <div class="nav-group-title">编解码</div>
          <ul class="nav-list" id="nav-encoders"></ul>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">格式化</div>
          <ul class="nav-list" id="nav-formatters"></ul>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button id="theme-btn" class="theme-btn" title="切换主题">☾</button>
        <span class="version">v3.0</span>
      </div>
    </aside>

    <!-- 工作区 -->
    <main class="workspace">
      <header class="tool-header">
        <h1 class="tool-title" id="tool-title">Base64</h1>
        <p class="tool-desc" id="tool-desc"></p>
      </header>

      <section class="card input-card">
        <div class="card-head">
          <span class="card-title">输入内容</span>
          <button class="mini-btn" id="btn-paste" title="从剪贴板粘贴">粘贴</button>
        </div>
        <textarea id="input" class="io-area" spellcheck="false"
                  placeholder="在此输入内容…"></textarea>
      </section>

      <div class="actions" id="actions"></div>

      <section class="card output-card" id="output-card" hidden>
        <div class="card-head">
          <span class="card-title">输出结果</span>
          <span class="card-tools">
            <button class="mini-btn" id="btn-toinput" title="把结果送回输入框，继续下一步处理">⤵ 传回输入</button>
            <button class="mini-btn" id="btn-copy">复制</button>
            <button class="mini-btn" id="btn-clear">清空</button>
          </span>
        </div>
        <textarea id="output" class="io-area output" spellcheck="false" readonly></textarea>
        <div id="tree" class="tree"></div>
      </section>
    </main>
  </div>

  <!-- toast 提示 -->
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
